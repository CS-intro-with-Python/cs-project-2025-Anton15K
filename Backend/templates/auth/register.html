{% extends "base.html" %}

{% block title %}Register - CF Rating Tracker{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="glass-card rounded-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Create Account</h1>
            <p class="text-gray-400">Join the community of competitive programmers</p>
        </div>

        <form method="POST" action="{{ url_for('views.register') }}" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:border-indigo-500 transition-all"
                    placeholder="Choose a username">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:border-indigo-500 transition-all"
                    placeholder="you@example.com">
            </div>

            <div>
                <label for="cf_handle" class="block text-sm font-medium text-gray-300 mb-2">Codeforces Handle
                    (Optional)</label>
                <input type="text" id="cf_handle" name="cf_handle"
                    class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:border-indigo-500 transition-all"
                    placeholder="Your CF handle">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:border-indigo-500 transition-all"
                    placeholder="Create a password">
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-300 mb-2">Confirm
                    Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:border-indigo-500 transition-all"
                    placeholder="Confirm your password">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white py-3 rounded-lg font-semibold transition-all shadow-lg shadow-indigo-500/25">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-400">
                Already have an account?
                <a href="{{ url_for('views.login') }}" class="text-indigo-400 hover:text-indigo-300 font-medium">Sign
                    in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
