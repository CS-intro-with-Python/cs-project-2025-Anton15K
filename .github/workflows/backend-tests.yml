name: Backend test (requests)

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cs2025
          POSTGRES_PASSWORD: cs2025pass
          POSTGRES_DB: cs2025
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f Backend/requirements.txt ]; then pip install -r Backend/requirements.txt; fi
        pip install pytest

    - name: Run Tests
      env:
        DATABASE_URL: postgresql://cs2025:cs2025pass@localhost:5432/cs2025
        SECRET_KEY: test-secret
        FLASK_ENV: testing
        PYTHONPATH: .
      run: |
        pytest tests/

concurrency:
  group: backend-test-${{ github.ref }}
  cancel-in-progress: true
