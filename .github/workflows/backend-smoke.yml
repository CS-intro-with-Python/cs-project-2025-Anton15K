name: Backend test (requests)

on:
  push:
    paths:
      - 'Backend/**'
      - 'scripts/test_user_requests.py'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'db/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Backend/**'
      - 'scripts/test_user_requests.py'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'db/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    name: Build, run, and test API with database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency (requests)
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          sleep 10

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5001/api/v1/health | grep -q "ok"; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          docker compose logs backend
          exit 1

      - name: Run API tests
        env:
          BASE_URL: http://127.0.0.1:5001
        run: |
          python scripts/test_user_requests.py

      - name: Show container logs on failure
        if: failure()
        run: |
          echo '--- Docker Compose logs ---'
          docker compose logs

      - name: Stop and cleanup
        if: always()
        run: |
          docker compose down -v

concurrency:
  group: backend-test-${{ github.ref }}
  cancel-in-progress: true

