services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cs2025
      POSTGRES_PASSWORD: cs2025pass
      POSTGRES_DB: cs2025
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs2025 -d cs2025"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://cs2025:cs2025pass@db:5432/cs2025
      FLASK_ENV: development
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
